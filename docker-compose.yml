services:
  db:
    image: postgres:17
    container_name: onsort-db
    environment:
      POSTGRES_USER: onsort
      POSTGRES_PASSWORD: onsort
      POSTGRES_DB: onsort
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsort -d onsort"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

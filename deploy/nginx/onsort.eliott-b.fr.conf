# Bloc nginx pour « On Sort ? ».
#
# Installation :
#   sudo cp deploy/nginx/onsort.eliott-b.fr.conf /etc/nginx/sites-available/onsort
#   sudo ln -s /etc/nginx/sites-available/onsort /etc/nginx/sites-enabled/onsort
#   sudo nginx -t && sudo systemctl reload nginx
#
# Le certificat n'est pas obtenu ici. Si vous passez par certbot :
#   sudo certbot --nginx -d onsort.eliott-b.fr
# il complétera lui-même les directives `ssl_certificate` ci-dessous et ajoutera la
# redirection depuis le port 80. Dans ce cas, poser d'abord ce fichier **sans** le bloc TLS,
# ou laisser certbot écraser les deux lignes marquées.

server {
    listen 80;
    listen [::]:80;
    server_name onsort.eliott-b.fr;

    # Les cookies de session sont posés en `secure` en production : un navigateur ne les
    # renvoie jamais en clair. Servir l'application sur ce port produirait une connexion qui
    # semble réussir, puis une session disparue au rechargement suivant.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name onsort.eliott-b.fr;

    # --- Certificat ---------------------------------------------------------
    # À remplacer par vos chemins, ou à laisser certbot renseigner.
    ssl_certificate     /etc/letsencrypt/live/onsort.eliott-b.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onsort.eliott-b.fr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- En-têtes -----------------------------------------------------------
    # HSTS est posé ici et **nulle part ailleurs** : c'est nginx qui termine le TLS, c'est
    # donc à lui de l'affirmer. La pile interne, qui ne parle qu'en HTTP, ne le pose pas.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Les liens d'invitation et les liens magiques voyagent dans l'URL : leur chemin n'a
    # rien à faire dans l'en-tête `Referer` d'un site tiers.
    #
    # `strict-origin-when-cross-origin` et non `same-origin` : le second supprime l'en-tête
    # vers un autre domaine, or les serveurs de tuiles OpenStreetMap s'en servent pour
    # identifier l'application, comme le demande leur politique d'usage. Celui-ci envoie
    # l'origine **sans le chemin** — l'application est identifiée, le jeton ne fuit pas.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Une réponse d'API peut porter un jeton : aucun intermédiaire ne doit la garder.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Les téléversements ne sont pas une fonctionnalité du produit ; une limite basse
    # coûte moins qu'un corps de requête sans borne.
    client_max_body_size 2m;

    location / {
        # Cible unique. Le front et l'API sont servis sur la **même origine** par la pile
        # elle-même : `EventSource` ne permet pas d'envoyer d'en-têtes, l'authentification
        # du flux SSE passe donc par le cookie de session (conception §5.2). nginx n'a donc
        # rien à router, seulement à relayer.
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # `X-Real-IP` n'est pas décoratif. Better Auth limite `/api/auth/sign-in/*` à trois
        # requêtes par dix secondes **et par adresse**. Sans cette en-tête, l'application ne
        # résout aucune adresse et retombe sur un seau unique partagé par tous les
        # visiteurs : trois demandes de lien magique, et plus personne ne se connecte
        # pendant dix secondes.
        #
        # `proxy_set_header` **écrase** la valeur reçue : un client ne peut donc pas
        # l'usurper pour contourner la limite. C'est la raison pour laquelle l'application
        # lit celle-ci et non `X-Forwarded-For`, à laquelle n'importe qui peut préfixer ce
        # qu'il veut.
        proxy_set_header X-Real-IP         $remote_addr;

        # --- Indispensable pour le temps réel --------------------------------
        # nginx met les réponses en tampon par défaut. Un flux SSE ne se ferme jamais, donc
        # ce tampon ne se vide jamais : le décompte des votes et les soldes n'arriveraient
        # sur l'écran d'en face qu'après un rechargement à la main. Les démonstrations des
        # jalons M2 et M3 seraient perdues, et **aucune erreur n'apparaîtrait nulle part**.
        # conception.md §5.2 le mentionne explicitement.
        proxy_buffering off;
        proxy_cache off;

        # Un flux SSE reste ouvert indéfiniment : la coupure par défaut à 60 s le fermerait
        # sans cesse, et le client passerait son temps à se reconnecter.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
